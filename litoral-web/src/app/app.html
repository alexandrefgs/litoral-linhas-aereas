<header class="border-b border-line bg-surface">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3">
    <div class="flex items-center gap-3">
      <img src="favicon.svg" alt="" class="h-9 w-9" />
      <span class="text-lg font-bold text-primary">Litoral <span class="font-normal text-ink-muted">Linhas Aéreas</span></span>
    </div>
    <div class="flex items-center gap-3">
      <app-language-switcher />
      <app-theme-toggle />
    </div>
  </div>
</header>

<main class="mx-auto flex max-w-6xl flex-col items-center gap-6 px-6 py-24 text-center">
  <span class="rounded-full bg-highlight px-3 py-1 text-sm font-medium text-on-highlight">LTL · LITORAL</span>
  <h1 class="text-4xl font-bold text-ink md:text-5xl">{{ 'home.welcome' | t }}</h1>
  <p class="max-w-xl text-lg text-ink-muted">{{ 'home.subtitle' | t }}</p>
  <div class="flex gap-3">
    <button class="rounded-md bg-primary px-5 py-2.5 font-medium text-on-primary hover:bg-primary-hover">{{ 'home.cta' | t }}</button>
    <span class="rounded-md bg-accent px-5 py-2.5 font-medium text-on-accent">LTL3412</span>
  </div>
</main>
